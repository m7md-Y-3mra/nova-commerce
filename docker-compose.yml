name: nova-store

services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8090}:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes: &wp_volumes
      - wp_html:/var/www/html
      - ./wp-content/themes/nova-store:/var/www/html/wp-content/themes/nova-store
      - ./wp-content/plugins/nova-store-core:/var/www/html/wp-content/plugins/nova-store-core
      - ./seed:/seed:ro

  # One-off WP-CLI container: `docker compose run --rm wpcli <command>`
  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp_env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp_volumes
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db_data:
  wp_html:
